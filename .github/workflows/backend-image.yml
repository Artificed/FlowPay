name: backend image

on:
  push:
    branches: [main]
    paths:
      - flowpay-be/**
      - .github/workflows/backend-image.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-image

jobs:
  push:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the image tag
        id: tag
        run: echo "sha=$(git log -1 --format=%H -- flowpay-be .github/workflows/backend-image.yml)" >> "$GITHUB_OUTPUT"

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::422661068405:role/flowpay-github-ecr-push
          aws-region: ap-southeast-3

      - name: Check whether the image is already in ECR
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          if out=$(aws ecr describe-images --repository-name flowpay-backend --image-ids "imageTag=$TAG" 2>&1); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q ImageNotFoundException <<< "$out"; then
            echo "$out" >&2
            exit 1
          fi

      - name: Log in to ECR
        if: steps.existing.outputs.found != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: flowpay-be
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/flowpay-backend:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
