name: deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Bring the app layer up or tear it down
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy

jobs:
  terraform:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the image tag
        id: tag
        run: echo "sha=$(git log -1 --format=%H -- flowpay-be .github/workflows/backend-image.yml)" >> "$GITHUB_OUTPUT"

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::422661068405:role/flowpay-github-deploy
          aws-region: ap-southeast-3

      - name: Check that the image is in ECR
        if: inputs.action == 'apply'
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: aws ecr describe-images --repository-name flowpay-backend --image-ids "imageTag=$TAG"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Init
        working-directory: terraform/app
        run: terraform init -input=false

      - name: Apply or destroy
        working-directory: terraform/app
        env:
          ACTION: ${{ inputs.action }}
          TF_VAR_backend_image_tag: ${{ steps.tag.outputs.sha }}
        run: terraform "$ACTION" -auto-approve -input=false

  frontend:
    needs: terraform
    if: inputs.action == 'apply'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/frontend.yml
