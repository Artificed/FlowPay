name: frontend

on:
  push:
    branches: [main]
    paths:
      - flowpay-fe/**
      - .github/workflows/frontend.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend

env:
  BUCKET: flowpay-frontend-422661068405

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::422661068405:role/flowpay-github-frontend-upload
          aws-region: ap-southeast-3

      - name: Check whether the frontend bucket exists
        id: bucket
        run: |
          if out=$(aws s3api head-bucket --bucket "$BUCKET" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "Not Found" <<< "$out"; then
            echo "The app layer is down, so there is nothing to upload to."
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Set up Node
        if: steps.bucket.outputs.exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flowpay-fe/package-lock.json

      - name: Build
        if: steps.bucket.outputs.exists == 'true'
        working-directory: flowpay-fe
        env:
          VITE_API_URL: https://api.flowpay.my.id/api
        run: |
          npm ci
          npm run build

      - name: Upload
        if: steps.bucket.outputs.exists == 'true'
        working-directory: flowpay-fe
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --cache-control "no-cache"
